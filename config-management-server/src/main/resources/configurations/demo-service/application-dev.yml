spring:
  application:
    name: demo-service

  # consul configuration
  cloud:
    consul:
      port: 8500
      host: localhost
      discovery:
        enabled: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        instance-id: ${spring.application.name}:${server.port}:${spring.cloud.client.ip-address}
        prefer-ip-address: true
        acl-token: ${CONSUL_TOKEN}

  # Database config
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/demo
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: USERHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8002
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
  metrics:
    enable:
      all: true

message:
  hello: "IME emittance. This is centralized config for demo-service."
