version: "3.9"

services:
  vault:
    image: hashicorp/vault:1.15.2
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "c54cde87-7570-4349-84c0-6cb48d53d8e9"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TOKEN: "c54cde87-7570-4349-84c0-6cb48d53d8e9"
    cap_add:
      - IPC_LOCK
    command: "server -dev -dev-root-token-id=c54cde87-7570-4349-84c0-6cb48d53d8e9"
    volumes:
      - vault-file:/vault/file

volumes:
  vault-file:
